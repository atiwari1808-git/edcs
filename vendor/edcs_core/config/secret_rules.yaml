rules:
  - id: EDCS-SEC-001
    name: Generic assigned secret
    pattern: '(?i)\b(password|passwd|pwd|secret|token|api[_-]?key|apikey|auth[_-]?key|access[_-]?key)\b\s*[:=]\s*["'']?(?!\$\{|\{\{|%\(|<[A-Z_]+>|None\b|null\b|""|'''')(\S{4,})'
    severity: CRITICAL
    reason: Credential assigned to a literal value
    recommendation: Move to vault/.env injected at runtime; rotate the exposed value.
  - id: EDCS-SEC-002
    name: Private key block
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |PGP )?PRIVATE KEY(?: BLOCK)?-----'
    severity: CRITICAL
    reason: Private key material committed to the repository
    recommendation: Remove key, rotate the key pair, store keys in a secure keystore.
  - id: EDCS-SEC-003
    name: Authorization header / Bearer token
    pattern: '(?i)authorization["'']?\s*[:=]\s*["'']?(basic|bearer)\s+[A-Za-z0-9+/=_\-\.]{16,}'
    severity: CRITICAL
    reason: Hardcoded HTTP Authorization header
    recommendation: Inject tokens at runtime from a secret store.
  - id: EDCS-SEC-004
    name: JWT
    pattern: '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{5,}\b'
    severity: HIGH
    reason: JSON Web Token embedded in source
    recommendation: Revoke the token and load tokens from environment/vault.
  - id: EDCS-SEC-005
    name: Connection string with credentials
    pattern: '\b[a-z][a-z0-9+.-]*://[^/\s:@"'']{1,64}:[^@\s"'']{1,128}@[^\s"'']+'
    severity: CRITICAL
    reason: URL embeds username:password
    recommendation: Use credential-less URLs with runtime auth injection.
  - id: EDCS-SEC-006
    name: SNMP community string
    pattern: '(?i)\b(snmp[_-]?community|community[_-]?string|community)\b\s*[:=]\s*["'']?(?!public\b|private\b)(\S{3,})'
    severity: HIGH
    reason: SNMP community string hardcoded
    recommendation: Store SNMP communities in configuration management secrets.
  - id: EDCS-SEC-007
    name: LDAP bind credential
    pattern: '(?i)\b(bindpw|bind[_-]?password|ldap[_-]?pass\w*)\b\s*[:=]\s*\S+'
    severity: CRITICAL
    reason: LDAP bind password hardcoded
    recommendation: Use runtime-injected LDAP credentials.
  - id: EDCS-SEC-008
    name: Expect script password send
    pattern: '(?i)send\s+["''][^"'']{0,80}(password|passwd)[^"'']{0,80}\\r'
    severity: HIGH
    reason: Expect script transmits a literal password
    recommendation: Feed credentials to expect via environment variables.
  - id: EDCS-SEC-009
    name: SSH key file reference with inline material
    pattern: 'ssh-(rsa|ed25519|dss) AAAA[0-9A-Za-z+/=]{50,}'
    severity: MEDIUM
    reason: SSH public key embedded (verify no private counterpart nearby)
    recommendation: Keep key material in dedicated key management, not source.
  - id: EDCS-SEC-010
    name: SMTP password
    pattern: '(?i)\b(smtp[_-]?pass\w*|mail[_-]?password)\b\s*[:=]\s*\S{4,}'
    severity: CRITICAL
    reason: SMTP credential hardcoded
    recommendation: Inject SMTP credentials at runtime.
allowlist_values:
  - '(?i)^(example|sample|dummy|placeholder|changeme|your[_-]?password|xxxx+|\*{4,}|<[^>]+>)$'
allowlist_paths:
  - 'tests/'
  - 'test/'
  - 'fixtures/'
entropy:
  base64_threshold: 4.5
  base64_min_len: 20
  hex_threshold: 3.0
  hex_min_len: 24
config_credential_keys:
  - password
  - passwd
  - pwd
  - secret
  - token
  - apikey
  - api_key
  - private_key
  - client_secret
  - bindpw

# Yelp detect-secrets plugin layer (rule EDCS-DS-001).
# OFF by default: it ignores the thresholds above and flags long file paths
# and numeric node/archive IDs as "Base64 High Entropy String" (false
# positives). The EDCS-SEC-00x rules above already catch real credentials.
# Set to true only if you want the extra, noisier coverage.
enable_detect_secrets_plugin: false
