{% extends "base.html" %}
{% load static %}
{% block title %}Password updated — Handover Scheduler{% endblock %}
{% block content %}
<div class="auth-card text-center" style="margin:28px auto;max-width:460px">
  <div class="brand-row justify-content-center">
    <img src="{% static 'img/logo.png' %}" alt="Ericsson" class="navbar-logo" style="width:26px">
    <h2 style="margin:0">Password updated</h2>
  </div>
  <div class="my-3" style="font-size:2.4rem;color:#22c55e"><i class="bi bi-check-circle"></i></div>
  <p class="auth-sub">Your password has been changed successfully. Your current session stays signed in.</p>
  <div class="d-grid">
    <a href="/" class="btn btn-primary btn-block"><i class="bi bi-house me-1"></i> Back to dashboard</a>
  </div>
</div>
{% endblock %}
